<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro | AutoElite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap">

<link rel="stylesheet" href="style.css">

<style>

.auth-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0d0f14;
  padding:2rem;
}

.auth-card{
  width:100%;
  max-width:450px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:3rem;
}

.auth-title{
  font-family:var(--f-serif);
  font-size:2.3rem;
  color:var(--white);
  margin-bottom:.5rem;
}

.auth-sub{
  color:var(--muted);
  margin-bottom:2rem;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:1.2rem;
}

.auth-form input{
  width:100%;
  padding:1rem;
  border-radius:12px;
  border:1px solid var(--border);
  background:#11151c;
  color:white;
  outline:none;
}

.auth-form input:focus{
  border-color:var(--accent);
}

.msg{
  margin-top:1rem;
  color:white;
}

.auth-bottom{
  margin-top:1.5rem;
  text-align:center;
  color:var(--muted);
}

.auth-bottom a{
  color:var(--accent);
  text-decoration:none;
}

</style>
</head>

<body>

<section class="auth-page">

  <div class="auth-card">

    <h1 class="auth-title">Crear cuenta</h1>

    <p class="auth-sub">
      Regístrate para acceder al catálogo premium.
    </p>

    <form id="registerForm" class="auth-form">

      <input
        type="text"
        id="name"
        placeholder="Nombre completo"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required
      >

      <button
        type="submit"
        class="btn btn--solid btn--lg"
      >
        Crear cuenta
      </button>

    </form>

    <div class="msg" id="msg"></div>

    <div class="auth-bottom">

      ¿Ya tienes cuenta?

      <a href="login.html">
        Iniciar sesión
      </a>

    </div>

  </div>

</section>

<script>

const form = document.getElementById('registerForm');

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const name = document.getElementById('name').value;

  const email = document.getElementById('email').value;

  const password = document.getElementById('password').value;

  try {

    const response = await fetch('/api/auth/register', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        name,
        email,
        password
      })

    });

    const data = await response.json();

    if(data.ok){

      document.getElementById('msg').innerHTML =
      '✅ Cuenta creada correctamente';

      setTimeout(() => {

        window.location.href = '/';

      }, 1200);

    } else {

      document.getElementById('msg').innerHTML =
      '❌ ' + data.error;

    }

  } catch(error){

    console.error(error);

    document.getElementById('msg').innerHTML =
    '❌ Error conectando con el servidor';

  }

});

</script>

</body>
</html>
